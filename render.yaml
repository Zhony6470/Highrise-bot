services:
  - type: web
    name: highrise-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ROOM_ID
        sync: false
      - key: API_KEY
        sync: false
