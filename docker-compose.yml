networks:
  highrise:
    driver: bridge

services:
  icecast:
    image: moul/icecast
    container_name: highrise-icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ICECAST_HOSTNAME: ${ICECAST_PUBLIC_HOST:-localhost}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-change-me-admin}
    volumes:
      - icecast_config:/etc/icecast2
      - icecast_config_data:/config
      - icecast_logs:/var/log/icecast2
    networks:
      - highrise

  autodj:
    build:
      context: .
      dockerfile: infra/Dockerfile.autodj
    container_name: highrise-autodj
    restart: unless-stopped
    networks:
      - highrise
    depends_on:
      icecast:
        condition: service_started
    environment:
      AUTODJ_TOKEN: ${AUTODJ_TOKEN}
      AUTODJ_HOST: 0.0.0.0
      AUTODJ_PORT: 8090
      YOUTUBE_COOKIES_PATH: /app/cookies.txt
      AUTODJ_USE_LIQUIDSOAP: "1"
    volumes:
      - autodj_data:/data
      - ./default_music:/data/default_music:ro
      - ./services/cookies.txt:/app/cookies-source.txt:ro
    command:
      - sh
      - -c
      - cp /app/cookies-source.txt /app/cookies.txt && python -u autodj.py


  liquidsoap:
    build:
      context: .
      dockerfile: infra/Dockerfile.liquidsoap
    container_name: highrise-liquidsoap
    restart: unless-stopped
    networks:
      - highrise
    depends_on:
      icecast:
        condition: service_started
      autodj:
        condition: service_started
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: 8000
      ICECAST_PASSWORD: ${ICECAST_PASSWORD}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-stream}
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: 1234
    volumes:
      - autodj_data:/data

  main-bot:
    build:
      context: .
      dockerfile: infra/Dockerfile.bot
    container_name: highrise-main-bot
    restart: unless-stopped
    networks:
      - highrise
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        while true; do
          python -u -m bots.bot1.main
          code=$$?
          echo "[MAIN] Proceso finalizó con código $$code; reiniciando en 2s..."
          sleep 2
        done

  music-bot:
    build:
      context: .
      dockerfile: infra/Dockerfile.bot
    container_name: highrise-music-bot
    restart: unless-stopped
    networks:
      - highrise
    env_file:
      - .env
    environment:
      MUSIC_ROOM_ID: ${MUSIC_ROOM_ID}
      MUSIC_API_KEY: ${MUSIC_API_KEY}
      AUTODJ_URL: http://autodj:8090
      AUTODJ_TOKEN: ${AUTODJ_TOKEN}
      MUSIC_DATA_FILE: /app/music_bot_data.json
    depends_on:
      - autodj
    volumes:
      - ./bots/dj/data/music_bot_data.json:/app/music_bot_data.json
    command:
      - sh
      - -c
      - |
        while true; do
          python -u -m bots.dj.music_bot
          code=$$?
          echo "[MUSIC] Proceso finalizó con código $$code; reiniciando en 2s..."
          sleep 2
        done

volumes:
  autodj_data:
    external: true
    name: refactor-test_autodj_data
  icecast_config:
  icecast_config_data:
  icecast_logs:
